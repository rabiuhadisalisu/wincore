name: Windows Server

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setting Up User
      shell: pwsh
      run: .\config.ps1

    - name: Installing and Configuring Tools
      shell: pwsh
      run: .\plugin.ps1

    - name: Tunnelling 
      shell: pwsh
      run: .\link.ps1

    - name: Holder
      run: sleep 86400  # 24 hours in seconds
